name: Vigilar web

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vigilar
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      URL: "https://esupcom.unr.edu.ar/ingreso_nivel_medio.php"
      TOPIC: "Supe-Emi74"
      INTERVALO: "20"
      VUELTAS: "14"
    steps:
      - uses: actions/checkout@v4

      - name: Configurar git
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

      - name: Mensaje de prueba (una sola vez)
        run: |
          if [ ! -f prueba_enviada.txt ]; then
            curl -s \
              -H "Title: Cambio la web del Supe" \
              -H "Priority: high" \
              -H "Click: $URL" \
              -d "PRUEBA: asi te va a llegar el aviso cuando haya un cambio en la pagina de ingreso" \
              "ntfy.sh/$TOPIC"
            echo "ok" > prueba_enviada.txt
            git add prueba_enviada.txt
            git commit -m "prueba enviada"
            git push
          fi

      - name: Chequear cambios cada pocos segundos
        run: |
          OLD=$(cat last_hash.txt 2>/dev/null || echo "")

          for i in $(seq 1 $VUELTAS); do
            rm -f page.html
            # -f: falla si el servidor devuelve error; -s test: ignora paginas vacias
            if curl -sLf --max-time 20 "$URL" -o page.html && [ -s page.html ] && grep -q "Ingreso Nivel Medio" page.html; then
              NEW=$(sha256sum page.html | cut -d' ' -f1)

              if [ "$NEW" != "$OLD" ]; then
                if [ -n "$OLD" ]; then
                  curl -s \
                    -H "Title: Cambio la web del Supe" \
                    -H "Priority: high" \
                    -H "Click: $URL" \
                    -d "Hubo un cambio en la pagina de ingreso" \
                    "ntfy.sh/$TOPIC"
                fi
                echo "$NEW" > last_hash.txt
                git add last_hash.txt
                git commit -m "actualizar hash"
                git push
                OLD="$NEW"
              fi
            fi
            sleep $INTERVALO
          done
