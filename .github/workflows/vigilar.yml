name: Vigilar web

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vigilar
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      URL: "https://esupcom.unr.edu.ar/ingreso_nivel_medio.php"
      TOPIC: "Supe-Emi74"
      INTERVALO: "20"
      VUELTAS: "14"
    steps:
      - uses: actions/checkout@v4

      - name: Configurar git
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

      - name: Mensaje de prueba (una sola vez)
        run: |
          if [ ! -f prueba_enviada.txt ]; then
            curl -s \
              -H "Title: Cambio la web del Supe" \
              -H "Priority: high" \
              -H "Click: $URL" \
              -d "PRUEBA: asi te va a llegar el aviso cuando haya un cambio en la pagina de ingreso" \
              "ntfy.sh/$TOPIC"
            echo "ok" > prueba_enviada.txt
            git add prueba_enviada.txt
            git commit -m "prueba enviada"
            git push
          fi

      - name: Chequear cambios cada pocos segundos
        run: |
          OLD=$(cat last_hash.txt 2>/dev/null || echo "")
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"

          for i in $(seq 1 $VUELTAS); do
            rm -f page.html
            CODE=$(curl -sL --max-time 20 -A "$UA" \
              -H "Cache-Control: no-cache" -H "Pragma: no-cache" \
              -w '%{http_code}' "$URL?t=$(date +%s)" -o page.html) || true
            CODE=${CODE:-000}
            SIZE=$(stat -c%s page.html 2>/dev/null || echo 0)
            NEW=$(sha256sum page.html 2>/dev/null | cut -d' ' -f1)
            VE=$(grep -c "14/12/2026" page.html 2>/dev/null || true)
            echo "[$i] http=$CODE bytes=$SIZE hash=${NEW:0:10} ve_14_12=$VE"

            if [ "$CODE" = "200" ] && [ "$SIZE" -gt 0 ]; then
              if [ "$NEW" != "$OLD" ]; then
                if [ -n "$OLD" ]; then
                  curl -s \
                    -H "Title: Cambio la web del Supe" \
                    -H "Priority: high" \
                    -H "Click: $URL" \
                    -d "Hubo un cambio en la pagina de ingreso" \
                    "ntfy.sh/$TOPIC"
                fi
                echo "$NEW" > last_hash.txt
                git add last_hash.txt
                git commit -m "actualizar hash"
                git pull --rebase || true
                git push || true
                OLD="$NEW"
              fi
            fi
            sleep $INTERVALO
          done
